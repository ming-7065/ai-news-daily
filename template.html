<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Daily - 每日 AI 與科技新聞</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Header */
        .header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header .emoji { font-size: 3em; }
        .header .subtitle {
            color: #888;
            margin-bottom: 20px;
        }
        .header .date {
            color: #666;
            font-size: 0.9em;
        }
        
        /* Summary */
        .summary {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            border-left: 4px solid #00d4ff;
        }
        .summary h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .summary p { line-height: 1.8; color: #ccc; }
        
        /* Trending */
        .trending {
            margin-bottom: 40px;
        }
        .trending h2 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 1.3em;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .trending-item {
            background: #1a1a2e;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
        }
        .trending-item .count {
            color: #00d4ff;
            font-size: 1.2em;
            font-weight: bold;
        }
        .trending-item .tag { color: #888; }
        
        /* News Section */
        .section-title {
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            font-size: 1.3em;
        }
        
        .news-item {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #222;
            transition: border-color 0.3s;
        }
        .news-item:hover { border-color: #444; }
        .news-item .score {
            display: inline-block;
            background: #ff6b6b;
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .news-item h3 {
            margin: 10px 0;
            font-size: 1.1em;
            color: #fff;
        }
        .news-item h3 a {
            color: inherit;
            text-decoration: none;
        }
        .news-item h3 a:hover { color: #00d4ff; }
        .news-item .desc {
            color: #999;
            margin: 10px 0;
            line-height: 1.6;
        }
        .news-item .meta {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 0.85em;
        }
        .news-item .tags { margin-top: 10px; }
        .news-item .tag {
            display: inline-block;
            background: #1a1a2e;
            color: #00d4ff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            font-size: 0.85em;
            border-top: 1px solid #222;
            margin-top: 60px;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
        
        /* Archive */
        .archive-link {
            display: inline-block;
            background: #1a1a2e;
            padding: 8px 16px;
            border-radius: 8px;
            color: #888;
            text-decoration: none;
            margin: 5px;
            transition: all 0.3s;
        }
        .archive-link:hover { background: #222; color: #00d4ff; }
        
        @media (max-width: 600px) {
            body { padding: 15px; }
            .header h1 { font-size: 1.8em; }
            .trending-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="emoji">🤖</div>
            <h1>AI Daily</h1>
            <p class="subtitle">每天早 8 點，5 分鐘看懂 AI 與科技圈</p>
            <p class="date">更新於 {{DATE}} · 收錄 {{COUNT}} 篇</p>
        </header>
        
        <div class="summary">
            <h2>📌 今日總結</h2>
            <p>{{SUMMARY}}</p>
        </div>
        
        <div class="trending">
            <h2>🔥 今日熱搜</h2>
            <div class="trending-grid">
                {{TRENDING}}
            </div>
        </div>
        
        <div class="news-section">
            <h2 class="section-title">頭條 · AI 前線</h2>
            {{TOP_NEWS}}
        </div>
        
        <div class="news-section" style="margin-top: 40px;">
            <h2 class="section-title">🛠️ 工具 · 開發</h2>
            {{TOOLS_NEWS}}
        </div>
        
        <footer class="footer">
            <p>由 AI 自動生成 · <a href="https://github.com/ming-7065/ai-news-daily">GitHub</a></p>
            <p style="margin-top: 10px;">
                <a href="archive.html">📁 過刊列表</a>
            </p>
        </footer>
    </div>
</body>
</html>
