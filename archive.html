<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 過刊列表 - AI Daily</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { color: #666; }
        .archive-grid {
            display: grid;
            gap: 10px;
        }
        .archive-item {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }
        .archive-item:hover {
            background: #1a1a2e;
            border-color: #00d4ff;
        }
        .archive-item .date { color: #00d4ff; font-weight: bold; }
        .archive-item .count { color: #666; font-size: 0.9em; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00d4ff;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
            font-size: 0.85em;
            border-top: 1px solid #222;
            margin-top: 60px;
        }
        .footer a { color: #00d4ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首頁</a>
        
        <header class="header">
            <h1>📁 過刊列表</h1>
            <p>點擊日期可查看當日完整新聞</p>
        </header>
        
        <div class="archive-grid" id="archive-list">
            <p style="color: #666; text-align: center;">載入中...</p>
        </div>
        
        <footer class="footer">
            <p>由 AI 自動生成 · <a href="https://github.com/ming-7065/ai-news-daily">GitHub</a></p>
        </footer>
    </div>
    
    <script>
        // 從 GitHub API 讀取 archive 目錄
        fetch('https://api.github.com/repos/ming-7065/ai-news-daily/contents/archive')
            .then(r => r.json())
            .then(files => {
                const list = document.getElementById('archive-list');
                if (!Array.isArray(files)) {
                    list.innerHTML = '<p style="color: #666; text-align: center;">尚無過刊</p>';
                    return;
                }
                const html = files
                    .filter(f => f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name))
                    .map(f => {
                        const date = f.name.replace('.html', '');
                        return `<a href="archive/${f.name}" class="archive-item">
                            <span class="date">${date}</span>
                            <span class="count">查看 →</span>
                        </a>`;
                    }).join('');
                list.innerHTML = html || '<p style="color: #666; text-align: center;">尚無過刊</p>';
            })
            .catch(() => {
                document.getElementById('archive-list').innerHTML = 
                    '<p style="color: #666; text-align: center;">無法載入過刊列表</p>';
            });
    </script>
</body>
</html>
